<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>IFC Viewer</title>
  <script src="https://cdn.jsdelivr.net/npm/web-ifc@0.0.57/web-ifc-api-browser.js"></script>
  <style>
    html, body { margin: 0; height: 100%; font-family: sans-serif; overflow: hidden; }
    #status { position: absolute; top: 8px; left: 8px; background: white; padding: 4px 8px; z-index: 5; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="status">Loading...</div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    

    const status = document.getElementById("status");

    try {
      // 3D scene
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xf2f2f2);
      const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 5000);
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(innerWidth, innerHeight);
      document.body.appendChild(renderer.domElement);
      const controls = new OrbitControls(camera, renderer.domElement);
      scene.add(new THREE.AmbientLight(0xffffff, 0.8));
      const sun = new THREE.DirectionalLight(0xffffff, 1.5);
      sun.position.set(50, 100, 50);
      scene.add(sun);

      // Download file
      status.textContent = "Step 1: downloading file...";
      const response = await fetch("model.ifc");
      if (!response.ok) throw new Error("Could not find model.ifc (error " + response.status + ")");
      const data = new Uint8Array(await response.arrayBuffer());

      // Start reader
      status.textContent = "Step 2: starting reader...";
      const ifc = new WebIFC.IfcAPI();
      ifc.SetWasmPath("https://cdn.jsdelivr.net/npm/web-ifc@0.0.57/");
      await ifc.Init();

      // Read building
      status.textContent = "Step 3: reading building...";
      const modelID = ifc.OpenModel(data);
      const group = new THREE.Group();
      scene.add(group);

      ifc.StreamAllMeshes(modelID, (flatMesh) => {
        const placed = flatMesh.geometries;
        for (let i = 0; i < placed.size(); i++) {
          const pg = placed.get(i);
          const geom = ifc.GetGeometry(modelID, pg.geometryExpressID);
          const verts = ifc.GetVertexArray(geom.GetVertexData(), geom.GetVertexDataSize());
          const idx = ifc.GetIndexArray(geom.GetIndexData(), geom.GetIndexDataSize());

          const buf = new THREE.InterleavedBuffer(verts, 6);
          const g = new THREE.BufferGeometry();
          g.setAttribute("position", new THREE.InterleavedBufferAttribute(buf, 3, 0));
          g.setAttribute("normal", new THREE.InterleavedBufferAttribute(buf, 3, 3));
          g.setIndex(new THREE.BufferAttribute(idx, 1));

          const c = pg.color;
          const mat = new THREE.MeshStandardMaterial({
            color: new THREE.Color(c.x, c.y, c.z),
            opacity: c.w,
            transparent: c.w < 1,
            side: THREE.DoubleSide
          });
          const mesh = new THREE.Mesh(g, mat);
          mesh.matrix.fromArray(pg.flatTransformation);
          mesh.matrixAutoUpdate = false;
          mesh.userData.expressID = flatMesh.expressID;
          group.add(mesh);
          geom.delete();
        }
      });

      // Point camera at the building
      const box = new THREE.Box3().setFromObject(group);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3()).length();
      controls.target.copy(center);
      camera.position.set(center.x + size, center.y + size * 0.6, center.z + size);
      camera.far = size * 20;
      camera.updateProjectionMatrix();
      controls.update();

      status.style.display = "none";

      addEventListener("resize", () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });
      renderer.setAnimationLoop(() => renderer.render(scene, camera));
    } catch (e) {
      status.textContent = "Error: " + e.message;
      console.error(e);
    }
  </script>
</body>
</html>
